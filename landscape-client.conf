[client]
bus = session
computer_title = debhash-client
account_name = onward
registration_key =
url = https://10.194.61.125/message-system
data_path = /tmp/landscape/
log_dir = /tmp/landscape/
log_level = debug
pid_file = /tmp/landscape/landscape-client.pid
ping_url = http://10.194.61.125/ping
ssl_public_key = landscape-server-jammy.com.crt


# The number of seconds between server exchanges
exchange_interval = 60

# The number of seconds between urgent exchanges with the server.
urgent_exchange_interval = 30

# The number of seconds between pings.
ping_interval = 15

# The number of seconds between apt update calls.
apt_update_interval = 21600

# The number of seconds between package monitor runs.
package_monitor_interval = 180

monitor_plugins = PackageMonitor

manager_plugins =

force_apt_update = true
